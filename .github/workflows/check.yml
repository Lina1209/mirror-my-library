name: Check JavaScript
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/google-cloud-ui-translation"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/db.js
          node --check js/parsers.js
          node --check js/translation.js
          node --check worker/google-translate-worker.js
