name: Check JavaScript
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["**"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check --input-type=module < js/app.js
          node --check --input-type=module < js/db.js
          node --check --input-type=module < js/parsers.js
          node --check --input-type=module < js/translation.js
          node --check --input-type=module < js/document-studio.js
          node --check --input-type=module < js/reader-experience.js
          node --check --input-type=module < worker/google-translate-worker.js
