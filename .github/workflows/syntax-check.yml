name: JavaScript syntax check
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser modules
        run: |
          node --check js/app.js
          node --check js/document-studio.js
          node --check js/db.js
          node --check js/parsers.js
